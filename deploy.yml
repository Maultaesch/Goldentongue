name: deploy
# Deploys the API gateway (Cloudflare Worker) and the website (Flutter web on Cloudflare Pages).
# Repository settings needed:
#   secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   variables: SUPABASE_URL (https://<project>.supabase.co), API_URL (https://api.example.com),
#              WEB_ORIGIN (https://app.example.com), SUPABASE_ANON_KEY, PAGES_PROJECT,
#              TURNSTILE_SITE_KEY (optional, empty = no captcha), PRIVACY_URL, TERMS_URL
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/worker
          command: deploy --var UPSTREAM:${{ vars.SUPABASE_URL }} --var ALLOWED_ORIGINS:${{ vars.WEB_ORIGIN }}

  web:
    runs-on: ubuntu-latest
    needs: worker
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: scripts/setup_web.sh ${{ vars.API_URL }}
      - run: flutter pub get
      - run: flutter test
      - run: >
          flutter build web --release --pwa-strategy=none
          --dart-define=SUPABASE_URL=${{ vars.API_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
          --dart-define=TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          --dart-define=TURNSTILE_BASE_URL=${{ vars.WEB_ORIGIN }}/
          --dart-define=PRIVACY_URL=${{ vars.PRIVACY_URL }}
          --dart-define=TERMS_URL=${{ vars.TERMS_URL }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ vars.PAGES_PROJECT }} --branch=main
