name: deploy-members
# Push-button launch without a terminal: deploys the Supabase AI functions and the members website.
# Repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Repository variables: PAGES_PROJECT (default goldentongue-web)
# Site settings (SUPABASE_URL, SUPABASE_ANON_KEY, OPENAI_API_KEY, ...) are set once in Cloudflare Pages > Settings > Variables.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'cloudflare/members-site/**']
jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy coach voice-analyze simulator blueprint exercise-evaluate create-checkout delete-account --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy stripe-webhook revenuecat-webhook --no-verify-jwt --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/members-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/members-site
          command: pages deploy public --project-name=${{ vars.PAGES_PROJECT || 'goldentongue-web' }} --branch=main
