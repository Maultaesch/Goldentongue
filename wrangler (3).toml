# Worker with static assets. Works with Cloudflare "Workers Builds" (Git integration).
# The member gate in functions/ is compiled into dist-worker/ by `npm run build`.
name = "goldentongue"
main = "dist-worker/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
AI_FREE_DAILY_LIMIT = "20"
# Fair-use cap per paying member and day for AI requests (admins are unlimited).
AI_MEMBER_DAILY_LIMIT = "300"
# "true": only paying members and admins get in. "false": every confirmed member gets in.
REQUIRE_PREMIUM = "true"
# Secrets (set in the dashboard): SUPABASE_URL, SUPABASE_ANON_KEY, OPENAI_API_KEY, TURNSTILE_SITE_KEY (optional)
